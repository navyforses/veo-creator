<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace — Personal Productivity Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.15);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.2);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
    --bg-0: #0a0a0f;
    --bg-1: #12121a;
    --bg-2: #1a1a26;
    --bg-3: #242433;
    --bg-hover: #2a2a3d;
    --border: #2a2a3d;
    --border-light: #1f1f2e;
    --text-0: #f0f0f5;
    --text-1: #c0c0cc;
    --text-2: #808099;
    --text-3: #55556a;
    --accent: #6c63ff;
    --accent-hover: #7b73ff;
    --accent-bg: rgba(108,99,255,0.12);
    --success: #10b981;
    --success-bg: rgba(16,185,129,0.12);
    --warning: #f59e0b;
    --warning-bg: rgba(245,158,11,0.12);
    --danger: #ef4444;
    --danger-bg: rgba(239,68,68,0.12);
    --info: #3b82f6;
    --info-bg: rgba(59,130,246,0.12);
}

[data-theme="light"] {
    --bg-0: #f5f5f7;
    --bg-1: #ffffff;
    --bg-2: #f0f0f3;
    --bg-3: #e5e5ea;
    --bg-hover: #eeeef3;
    --border: #d1d1d6;
    --border-light: #e5e5ea;
    --text-0: #1a1a2e;
    --text-1: #3a3a4a;
    --text-2: #6e6e80;
    --text-3: #9e9eb0;
    --accent: #6c63ff;
    --accent-hover: #5b52ee;
    --accent-bg: rgba(108,99,255,0.08);
    --success: #059669;
    --success-bg: rgba(5,150,105,0.08);
    --warning: #d97706;
    --warning-bg: rgba(217,119,6,0.08);
    --danger: #dc2626;
    --danger-bg: rgba(220,38,38,0.08);
    --info: #2563eb;
    --info-bg: rgba(37,99,235,0.08);
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-0); color: var(--text-0); font-size: 14px; line-height: 1.5; overflow: hidden; }

/* Layout */
.app { display: flex; height: 100vh; }
.sidebar { width: 240px; background: var(--bg-1); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width var(--transition); }
.sidebar.collapsed { width: 56px; }
.sidebar.collapsed .sidebar-label, .sidebar.collapsed .nav-text, .sidebar.collapsed .sidebar-footer-text, .sidebar.collapsed .quick-add { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Sidebar */
.sidebar-header { padding: 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-light); }
.sidebar-logo { font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.sidebar-toggle { margin-left: auto; width: 28px; height: 28px; border: none; background: transparent; color: var(--text-2); cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.sidebar-toggle:hover { background: var(--bg-hover); color: var(--text-0); }

.sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
.sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-3); padding: 12px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); transition: all var(--transition); border: none; background: none; width: 100%; text-align: left; font-size: 13px; font-family: var(--font); }
.nav-item:hover { background: var(--bg-hover); color: var(--text-0); }
.nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--accent-bg); color: var(--accent); font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }

.quick-add { margin: 8px; }
.quick-add-btn { width: 100%; padding: 8px; border: 1px dashed var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-2); cursor: pointer; font-size: 12px; font-family: var(--font); transition: all var(--transition); }
.quick-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

.sidebar-footer { padding: 8px; border-top: 1px solid var(--border-light); display: flex; gap: 4px; }
.sidebar-footer button { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; border-radius: var(--radius-sm); font-size: 16px; transition: all var(--transition); }
.sidebar-footer button:hover { background: var(--bg-hover); color: var(--text-0); }

/* Top bar */
.topbar { padding: 12px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 16px; background: var(--bg-1); }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-subtitle { font-size: 12px; color: var(--text-2); }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar-search { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-2); color: var(--text-0); font-size: 13px; font-family: var(--font); width: 200px; outline: none; transition: border-color var(--transition); }
.topbar-search:focus { border-color: var(--accent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-2); color: var(--text-1); cursor: pointer; font-size: 13px; font-family: var(--font); font-weight: 500; transition: all var(--transition); white-space: nowrap; }
.btn:hover { background: var(--bg-hover); color: var(--text-0); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }
.btn-ghost { border: none; background: transparent; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }

/* Content area */
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ===== KANBAN BOARD ===== */
.kanban { display: flex; gap: 16px; height: 100%; overflow-x: auto; padding-bottom: 16px; }
.kanban-column { min-width: 280px; max-width: 320px; flex: 1; background: var(--bg-1); border-radius: var(--radius); border: 1px solid var(--border-light); display: flex; flex-direction: column; }
.kanban-col-header { padding: 14px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 8px; }
.kanban-col-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.kanban-col-title { font-weight: 600; font-size: 13px; }
.kanban-col-count { font-size: 11px; color: var(--text-3); margin-left: 4px; }
.kanban-col-add { margin-left: auto; width: 24px; height: 24px; border: none; background: transparent; color: var(--text-3); cursor: pointer; border-radius: var(--radius-sm); font-size: 16px; display: flex; align-items: center; justify-content: center; }
.kanban-col-add:hover { background: var(--bg-hover); color: var(--text-0); }
.kanban-cards { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.kanban-card { background: var(--bg-2); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 12px; cursor: grab; transition: all var(--transition); }
.kanban-card:hover { border-color: var(--border); box-shadow: var(--shadow); }
.kanban-card.dragging { opacity: 0.5; transform: rotate(2deg); }
.kanban-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; word-break: break-word; }
.kanban-card-desc { font-size: 12px; color: var(--text-2); margin-bottom: 8px; word-break: break-word; }
.kanban-card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kanban-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.tag-urgent { background: var(--danger-bg); color: var(--danger); }
.tag-feature { background: var(--info-bg); color: var(--info); }
.tag-bug { background: var(--warning-bg); color: var(--warning); }
.tag-improvement { background: var(--success-bg); color: var(--success); }
.kanban-card-date { font-size: 11px; color: var(--text-3); margin-left: auto; }
.kanban-card-actions { display: none; margin-left: auto; }
.kanban-card:hover .kanban-card-actions { display: flex; gap: 2px; }
.kanban-card-actions button { width: 22px; height: 22px; border: none; background: transparent; color: var(--text-3); cursor: pointer; border-radius: 4px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.kanban-card-actions button:hover { background: var(--bg-hover); color: var(--text-0); }
.drop-indicator { height: 3px; background: var(--accent); border-radius: 2px; margin: 2px 0; }

/* ===== NOTES ===== */
.notes-layout { display: flex; height: 100%; gap: 0; }
.notes-list { width: 280px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; flex-shrink: 0; }
.notes-list-header { padding: 12px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 8px; }
.notes-list-items { flex: 1; overflow-y: auto; padding: 4px; }
.note-item { padding: 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); margin: 2px 0; }
.note-item:hover { background: var(--bg-hover); }
.note-item.active { background: var(--accent-bg); }
.note-item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-item-preview { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.note-item-date { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.notes-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.notes-editor-header { padding: 12px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 8px; }
.notes-editor-title { flex: 1; font-size: 15px; font-weight: 600; border: none; background: transparent; color: var(--text-0); font-family: var(--font); outline: none; }
.notes-editor-body { flex: 1; padding: 16px; }
.notes-editor-body textarea { width: 100%; height: 100%; border: none; background: transparent; color: var(--text-0); font-family: var(--font); font-size: 14px; line-height: 1.7; resize: none; outline: none; }
.note-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 14px; }

/* ===== POMODORO ===== */
.pomodoro { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 32px; }
.pomo-tabs { display: flex; gap: 4px; background: var(--bg-2); border-radius: var(--radius); padding: 4px; }
.pomo-tab { padding: 8px 20px; border: none; background: transparent; color: var(--text-2); cursor: pointer; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); font-weight: 500; transition: all var(--transition); }
.pomo-tab.active { background: var(--accent); color: #fff; }
.pomo-display { text-align: center; }
.pomo-time { font-size: 96px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -2px; color: var(--text-0); }
.pomo-label { font-size: 13px; color: var(--text-2); margin-top: 8px; }
.pomo-controls { display: flex; gap: 12px; }
.pomo-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg-2); color: var(--text-1); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
.pomo-btn:hover { border-color: var(--accent); color: var(--accent); }
.pomo-btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; width: 72px; height: 72px; font-size: 24px; }
.pomo-btn.primary:hover { background: var(--accent-hover); }
.pomo-stats { display: flex; gap: 32px; text-align: center; }
.pomo-stat-val { font-size: 24px; font-weight: 600; color: var(--accent); }
.pomo-stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
.pomo-ring { position: relative; width: 280px; height: 280px; }
.pomo-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pomo-ring-bg { fill: none; stroke: var(--bg-3); stroke-width: 6; }
.pomo-ring-progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.pomo-ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }

/* ===== HABITS ===== */
.habits-grid { display: flex; flex-direction: column; gap: 12px; }
.habit-row { background: var(--bg-1); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 16px; }
.habit-info { flex: 1; min-width: 0; }
.habit-name { font-size: 14px; font-weight: 600; }
.habit-streak { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.habit-week { display: flex; gap: 6px; }
.habit-day { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-3); transition: all var(--transition); }
.habit-day:hover { border-color: var(--accent); }
.habit-day.checked { background: var(--success); border-color: var(--success); color: #fff; font-weight: 700; }
.habit-day-label { font-size: 9px; color: var(--text-3); text-align: center; margin-bottom: 2px; }
.habit-actions { display: flex; gap: 4px; }
.habit-progress { width: 60px; text-align: center; }
.habit-progress-val { font-size: 18px; font-weight: 700; color: var(--success); }
.habit-progress-label { font-size: 10px; color: var(--text-3); }
.habit-add-form { display: flex; gap: 8px; padding: 12px; background: var(--bg-1); border: 1px dashed var(--border); border-radius: var(--radius); }
.habit-add-form input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-2); color: var(--text-0); font-size: 13px; font-family: var(--font); outline: none; }
.habit-add-form input:focus { border-color: var(--accent); }

/* ===== MODAL ===== */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close { width: 28px; height: 28px; border: none; background: transparent; color: var(--text-2); cursor: pointer; border-radius: var(--radius-sm); font-size: 18px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--bg-hover); color: var(--text-0); }
.modal-body { padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-2); color: var(--text-0); font-size: 13px; font-family: var(--font); outline: none; transition: border-color var(--transition); }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-select { cursor: pointer; }

/* Toast */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); color: #fff; }
.toast-error { background: var(--danger); color: #fff; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* Responsive */
@media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 100; height: 100%; transform: translateX(-100%); transition: transform var(--transition); }
    .sidebar.mobile-open { transform: translateX(0); }
    .notes-list { width: 100%; }
    .notes-layout { flex-direction: column; }
    .kanban-column { min-width: 260px; }
}
</style>
</head>
<body>

<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Workspace</span>
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">&#9776;</button>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-label">Main</div>
            <button class="nav-item active" data-page="tasks">
                <span class="nav-icon">&#9744;</span>
                <span class="nav-text">Tasks</span>
                <span class="nav-badge" id="taskCount">0</span>
            </button>
            <button class="nav-item" data-page="notes">
                <span class="nav-icon">&#9997;</span>
                <span class="nav-text">Notes</span>
            </button>
            <button class="nav-item" data-page="pomodoro">
                <span class="nav-icon">&#9201;</span>
                <span class="nav-text">Pomodoro</span>
            </button>
            <button class="nav-item" data-page="habits">
                <span class="nav-icon">&#10003;</span>
                <span class="nav-text">Habits</span>
            </button>
            <div class="sidebar-label">Data</div>
            <button class="nav-item" id="exportBtn">
                <span class="nav-icon">&#8681;</span>
                <span class="nav-text">Export Data</span>
            </button>
            <button class="nav-item" id="importBtn">
                <span class="nav-icon">&#8679;</span>
                <span class="nav-text">Import Data</span>
            </button>
        </nav>
        <div class="quick-add">
            <button class="quick-add-btn" id="quickAddBtn">+ Quick Add Task</button>
        </div>
        <div class="sidebar-footer">
            <button id="themeToggle" title="Toggle theme">&#9789;</button>
            <button id="clearAllBtn" title="Clear all data">&#128465;</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main">
        <header class="topbar">
            <div>
                <div class="topbar-title" id="pageTitle">Tasks</div>
                <div class="topbar-subtitle" id="pageSubtitle">Manage your tasks with drag & drop</div>
            </div>
            <div class="topbar-actions">
                <input class="topbar-search" type="text" placeholder="Search..." id="globalSearch">
            </div>
        </header>

        <div class="content" id="content">
            <!-- Pages rendered here by JS -->
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Modal</div>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Hidden file input for import -->
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
(() => {
'use strict';

// ============================================================
//  DATA LAYER — localStorage persistence
// ============================================================
const STORAGE_KEY = 'workspace_data';

const defaultData = () => ({
    tasks: {
        todo: [],
        inProgress: [],
        review: [],
        done: [],
    },
    notes: [],
    pomodoro: {
        sessionsToday: 0,
        totalSessions: 0,
        lastDate: new Date().toDateString(),
    },
    habits: [],
    settings: {
        theme: 'dark',
        pomoDuration: 25,
        shortBreak: 5,
        longBreak: 15,
    },
});

let data;

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            data = JSON.parse(raw);
            // Ensure all keys exist (migration)
            const def = defaultData();
            for (const key of Object.keys(def)) {
                if (!(key in data)) data[key] = def[key];
            }
            if (!data.tasks.review) data.tasks.review = [];
        } else {
            data = defaultData();
        }
    } catch {
        data = defaultData();
    }
}

function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

loadData();

// ============================================================
//  UTILITIES
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(d) {
    const dt = new Date(d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function todayStr() { return new Date().toISOString().split('T')[0]; }

// Toast
function toast(message, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = message;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

// Modal
function openModal(title, bodyHtml, footerHtml) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml;
    document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
});

// ============================================================
//  NAVIGATION
// ============================================================
let currentPage = 'tasks';

const pageInfo = {
    tasks: { title: 'Tasks', subtitle: 'Manage your tasks with drag & drop' },
    notes: { title: 'Notes', subtitle: 'Write and organize your thoughts' },
    pomodoro: { title: 'Pomodoro', subtitle: 'Stay focused with timed work sessions' },
    habits: { title: 'Habits', subtitle: 'Track your daily habits and build streaks' },
};

function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item[data-page]').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    document.getElementById('pageTitle').textContent = pageInfo[page].title;
    document.getElementById('pageSubtitle').textContent = pageInfo[page].subtitle;
    renderPage();
}

document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.page));
});

function renderPage() {
    const content = document.getElementById('content');
    switch (currentPage) {
        case 'tasks': renderTasks(content); break;
        case 'notes': renderNotes(content); break;
        case 'pomodoro': renderPomodoro(content); break;
        case 'habits': renderHabits(content); break;
    }
}

// ============================================================
//  KANBAN — Tasks
// ============================================================
const COLUMNS = [
    { id: 'todo', title: 'To Do', color: 'var(--text-2)' },
    { id: 'inProgress', title: 'In Progress', color: 'var(--warning)' },
    { id: 'review', title: 'Review', color: 'var(--info)' },
    { id: 'done', title: 'Done', color: 'var(--success)' },
];

const TAG_CLASSES = { urgent: 'tag-urgent', feature: 'tag-feature', bug: 'tag-bug', improvement: 'tag-improvement' };

function renderTasks(container) {
    updateTaskCount();
    container.innerHTML = `<div class="kanban">${COLUMNS.map(col => {
        const cards = data.tasks[col.id] || [];
        return `<div class="kanban-column" data-col="${col.id}">
            <div class="kanban-col-header">
                <div class="kanban-col-dot" style="background:${col.color}"></div>
                <div class="kanban-col-title">${col.title}</div>
                <div class="kanban-col-count">${cards.length}</div>
                <button class="kanban-col-add" data-col="${col.id}" title="Add task">+</button>
            </div>
            <div class="kanban-cards" data-col="${col.id}">
                ${cards.map(card => renderCard(card)).join('')}
            </div>
        </div>`;
    }).join('')}</div>`;

    // Drag and drop
    setupDragAndDrop();

    // Add task buttons
    container.querySelectorAll('.kanban-col-add').forEach(btn => {
        btn.onclick = () => openTaskModal(btn.dataset.col);
    });

    // Card delete/edit
    container.querySelectorAll('.card-delete').forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            deleteTask(btn.dataset.id);
        };
    });

    container.querySelectorAll('.card-edit').forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            editTask(btn.dataset.id);
        };
    });
}

function renderCard(card) {
    const tags = (card.tags || []).map(t => `<span class="kanban-tag ${TAG_CLASSES[t] || ''}">${esc(t)}</span>`).join('');
    return `<div class="kanban-card" draggable="true" data-id="${card.id}">
        <div style="display:flex;align-items:start">
            <div class="kanban-card-title">${esc(card.title)}</div>
            <div class="kanban-card-actions">
                <button class="card-edit" data-id="${card.id}" title="Edit">&#9998;</button>
                <button class="card-delete" data-id="${card.id}" title="Delete">&times;</button>
            </div>
        </div>
        ${card.description ? `<div class="kanban-card-desc">${esc(card.description)}</div>` : ''}
        <div class="kanban-card-meta">
            ${tags}
            ${card.date ? `<span class="kanban-card-date">${formatDate(card.date)}</span>` : ''}
        </div>
    </div>`;
}

function setupDragAndDrop() {
    const cards = document.querySelectorAll('.kanban-card');
    const columns = document.querySelectorAll('.kanban-cards');

    cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
            card.classList.add('dragging');
            e.dataTransfer.setData('text/plain', card.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });

    columns.forEach(col => {
        col.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const dragging = document.querySelector('.dragging');
            if (!dragging) return;
            const afterElement = getDragAfterElement(col, e.clientY);
            if (afterElement) col.insertBefore(dragging, afterElement);
            else col.appendChild(dragging);
        });

        col.addEventListener('drop', (e) => {
            e.preventDefault();
            const cardId = e.dataTransfer.getData('text/plain');
            const targetCol = col.dataset.col;

            // Remove from all columns
            let card;
            for (const colId of Object.keys(data.tasks)) {
                const idx = data.tasks[colId].findIndex(c => c.id === cardId);
                if (idx !== -1) {
                    card = data.tasks[colId].splice(idx, 1)[0];
                    break;
                }
            }
            if (!card) return;

            // Find insert position
            const afterEl = getDragAfterElement(col, e.clientY);
            const targetCards = data.tasks[targetCol];
            if (afterEl) {
                const afterIdx = targetCards.findIndex(c => c.id === afterEl.dataset.id);
                targetCards.splice(afterIdx, 0, card);
            } else {
                targetCards.push(card);
            }

            saveData();
            renderTasks(document.getElementById('content'));
        });
    });
}

function getDragAfterElement(container, y) {
    const elements = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
    return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function openTaskModal(column, existingTask = null) {
    const isEdit = !!existingTask;
    const task = existingTask || { title: '', description: '', tags: [], date: '' };

    openModal(isEdit ? 'Edit Task' : 'New Task', `
        <div class="form-group">
            <label class="form-label">Title</label>
            <input class="form-input" id="taskTitle" value="${esc(task.title)}" placeholder="Task title..." autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="taskDesc" placeholder="Optional description...">${esc(task.description || '')}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Tags (comma separated)</label>
            <input class="form-input" id="taskTags" value="${(task.tags || []).join(', ')}" placeholder="urgent, feature, bug, improvement">
        </div>
        <div class="form-group">
            <label class="form-label">Due Date</label>
            <input class="form-input" id="taskDate" type="date" value="${task.date || ''}">
        </div>
    `, `
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="taskSaveBtn">${isEdit ? 'Save' : 'Create'}</button>
    `);

    setTimeout(() => document.getElementById('taskTitle').focus(), 100);

    document.getElementById('taskSaveBtn').onclick = () => {
        const title = document.getElementById('taskTitle').value.trim();
        if (!title) { toast('Title is required', 'error'); return; }
        const desc = document.getElementById('taskDesc').value.trim();
        const tags = document.getElementById('taskTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        const date = document.getElementById('taskDate').value;

        if (isEdit) {
            existingTask.title = title;
            existingTask.description = desc;
            existingTask.tags = tags;
            existingTask.date = date;
        } else {
            data.tasks[column].push({ id: uid(), title, description: desc, tags, date, created: Date.now() });
        }

        saveData();
        closeModal();
        renderTasks(document.getElementById('content'));
        toast(isEdit ? 'Task updated' : 'Task created');
    };
}

function deleteTask(id) {
    for (const col of Object.keys(data.tasks)) {
        const idx = data.tasks[col].findIndex(c => c.id === id);
        if (idx !== -1) { data.tasks[col].splice(idx, 1); break; }
    }
    saveData();
    renderTasks(document.getElementById('content'));
    toast('Task deleted');
}

function editTask(id) {
    for (const col of Object.keys(data.tasks)) {
        const task = data.tasks[col].find(c => c.id === id);
        if (task) { openTaskModal(col, task); return; }
    }
}

function updateTaskCount() {
    const total = Object.values(data.tasks).reduce((sum, arr) => sum + arr.length, 0) - (data.tasks.done || []).length;
    document.getElementById('taskCount').textContent = total;
}

// ============================================================
//  NOTES
// ============================================================
let activeNoteId = null;

function renderNotes(container) {
    const notes = data.notes || [];

    if (!activeNoteId && notes.length > 0) activeNoteId = notes[0].id;

    const activeNote = notes.find(n => n.id === activeNoteId);

    container.innerHTML = `<div class="notes-layout" style="height:100%">
        <div class="notes-list">
            <div class="notes-list-header">
                <button class="btn btn-sm btn-primary" id="newNoteBtn">+ New Note</button>
                <input class="topbar-search" style="flex:1;width:auto" type="text" placeholder="Search notes..." id="noteSearch">
            </div>
            <div class="notes-list-items" id="notesList">
                ${notes.map(n => `
                    <div class="note-item ${n.id === activeNoteId ? 'active' : ''}" data-id="${n.id}">
                        <div class="note-item-title">${esc(n.title || 'Untitled')}</div>
                        <div class="note-item-preview">${esc((n.content || '').slice(0, 60))}</div>
                        <div class="note-item-date">${formatDate(n.updated || n.created)}</div>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="notes-editor">
            ${activeNote ? `
                <div class="notes-editor-header">
                    <input class="notes-editor-title" id="noteTitleInput" value="${esc(activeNote.title || '')}" placeholder="Note title...">
                    <button class="btn btn-sm btn-ghost btn-danger" id="deleteNoteBtn">Delete</button>
                </div>
                <div class="notes-editor-body">
                    <textarea id="noteContentInput" placeholder="Start writing...">${esc(activeNote.content || '')}</textarea>
                </div>
            ` : `<div class="note-empty">Select or create a note</div>`}
        </div>
    </div>`;

    // Event listeners
    document.getElementById('newNoteBtn')?.addEventListener('click', () => {
        const note = { id: uid(), title: '', content: '', created: Date.now(), updated: Date.now() };
        data.notes.unshift(note);
        activeNoteId = note.id;
        saveData();
        renderNotes(container);
        setTimeout(() => document.getElementById('noteTitleInput')?.focus(), 50);
    });

    container.querySelectorAll('.note-item').forEach(el => {
        el.onclick = () => {
            activeNoteId = el.dataset.id;
            renderNotes(container);
        };
    });

    document.getElementById('noteTitleInput')?.addEventListener('input', (e) => {
        const note = data.notes.find(n => n.id === activeNoteId);
        if (note) { note.title = e.target.value; note.updated = Date.now(); saveData(); updateNoteListItem(note); }
    });

    document.getElementById('noteContentInput')?.addEventListener('input', (e) => {
        const note = data.notes.find(n => n.id === activeNoteId);
        if (note) { note.content = e.target.value; note.updated = Date.now(); saveData(); updateNoteListItem(note); }
    });

    document.getElementById('deleteNoteBtn')?.addEventListener('click', () => {
        data.notes = data.notes.filter(n => n.id !== activeNoteId);
        activeNoteId = data.notes.length > 0 ? data.notes[0].id : null;
        saveData();
        renderNotes(container);
        toast('Note deleted');
    });

    document.getElementById('noteSearch')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        container.querySelectorAll('.note-item').forEach(el => {
            const note = data.notes.find(n => n.id === el.dataset.id);
            el.style.display = (!q || (note && (note.title?.toLowerCase().includes(q) || note.content?.toLowerCase().includes(q)))) ? '' : 'none';
        });
    });
}

function updateNoteListItem(note) {
    const el = document.querySelector(`.note-item[data-id="${note.id}"]`);
    if (el) {
        el.querySelector('.note-item-title').textContent = note.title || 'Untitled';
        el.querySelector('.note-item-preview').textContent = (note.content || '').slice(0, 60);
    }
}

// ============================================================
//  POMODORO TIMER
// ============================================================
let pomoState = { running: false, timeLeft: 0, mode: 'work', interval: null };

function renderPomodoro(container) {
    // Reset date
    if (data.pomodoro.lastDate !== new Date().toDateString()) {
        data.pomodoro.sessionsToday = 0;
        data.pomodoro.lastDate = new Date().toDateString();
        saveData();
    }

    if (!pomoState.timeLeft && !pomoState.running) {
        pomoState.timeLeft = data.settings.pomoDuration * 60;
    }

    const circumference = 2 * Math.PI * 124;
    const total = pomoState.mode === 'work' ? data.settings.pomoDuration * 60
        : pomoState.mode === 'short' ? data.settings.shortBreak * 60
        : data.settings.longBreak * 60;
    const progress = 1 - (pomoState.timeLeft / total);
    const dashOffset = circumference * (1 - progress);

    const mins = Math.floor(pomoState.timeLeft / 60).toString().padStart(2, '0');
    const secs = (pomoState.timeLeft % 60).toString().padStart(2, '0');

    container.innerHTML = `<div class="pomodoro">
        <div class="pomo-tabs">
            <button class="pomo-tab ${pomoState.mode === 'work' ? 'active' : ''}" data-mode="work">Focus</button>
            <button class="pomo-tab ${pomoState.mode === 'short' ? 'active' : ''}" data-mode="short">Short Break</button>
            <button class="pomo-tab ${pomoState.mode === 'long' ? 'active' : ''}" data-mode="long">Long Break</button>
        </div>
        <div class="pomo-ring">
            <svg viewBox="0 0 260 260">
                <circle class="pomo-ring-bg" cx="130" cy="130" r="124"/>
                <circle class="pomo-ring-progress" cx="130" cy="130" r="124"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${dashOffset}"/>
            </svg>
            <div class="pomo-ring-center">
                <div class="pomo-time">${mins}:${secs}</div>
                <div class="pomo-label">${pomoState.mode === 'work' ? 'Focus Time' : 'Break Time'}</div>
            </div>
        </div>
        <div class="pomo-controls">
            <button class="pomo-btn" id="pomoReset" title="Reset">&#8634;</button>
            <button class="pomo-btn primary" id="pomoToggle">${pomoState.running ? '&#9646;&#9646;' : '&#9654;'}</button>
            <button class="pomo-btn" id="pomoSkip" title="Skip">&#9654;&#9654;</button>
        </div>
        <div class="pomo-stats">
            <div>
                <div class="pomo-stat-val">${data.pomodoro.sessionsToday}</div>
                <div class="pomo-stat-label">Today</div>
            </div>
            <div>
                <div class="pomo-stat-val">${data.pomodoro.totalSessions}</div>
                <div class="pomo-stat-label">Total</div>
            </div>
            <div>
                <div class="pomo-stat-val">${Math.round(data.pomodoro.totalSessions * data.settings.pomoDuration / 60)}h</div>
                <div class="pomo-stat-label">Focus Hours</div>
            </div>
        </div>
    </div>`;

    // Tab switching
    container.querySelectorAll('.pomo-tab').forEach(tab => {
        tab.onclick = () => switchPomoMode(tab.dataset.mode);
    });

    document.getElementById('pomoToggle').onclick = togglePomodoro;
    document.getElementById('pomoReset').onclick = resetPomodoro;
    document.getElementById('pomoSkip').onclick = skipPomodoro;
}

function switchPomoMode(mode) {
    if (pomoState.interval) clearInterval(pomoState.interval);
    pomoState.running = false;
    pomoState.mode = mode;
    const durations = { work: data.settings.pomoDuration, short: data.settings.shortBreak, long: data.settings.longBreak };
    pomoState.timeLeft = durations[mode] * 60;
    if (currentPage === 'pomodoro') renderPomodoro(document.getElementById('content'));
}

function togglePomodoro() {
    if (pomoState.running) {
        clearInterval(pomoState.interval);
        pomoState.running = false;
    } else {
        pomoState.running = true;
        pomoState.interval = setInterval(() => {
            pomoState.timeLeft--;
            if (pomoState.timeLeft <= 0) {
                clearInterval(pomoState.interval);
                pomoState.running = false;
                if (pomoState.mode === 'work') {
                    data.pomodoro.sessionsToday++;
                    data.pomodoro.totalSessions++;
                    saveData();
                    toast('Focus session complete! Take a break.');
                    // Auto switch to break
                    const nextMode = data.pomodoro.sessionsToday % 4 === 0 ? 'long' : 'short';
                    switchPomoMode(nextMode);
                    return;
                } else {
                    toast('Break over! Ready to focus?');
                    switchPomoMode('work');
                    return;
                }
            }
            if (currentPage === 'pomodoro') updatePomoDisplay();
        }, 1000);
    }
    if (currentPage === 'pomodoro') renderPomodoro(document.getElementById('content'));
}

function resetPomodoro() {
    if (pomoState.interval) clearInterval(pomoState.interval);
    pomoState.running = false;
    const durations = { work: data.settings.pomoDuration, short: data.settings.shortBreak, long: data.settings.longBreak };
    pomoState.timeLeft = durations[pomoState.mode] * 60;
    if (currentPage === 'pomodoro') renderPomodoro(document.getElementById('content'));
}

function skipPomodoro() {
    if (pomoState.interval) clearInterval(pomoState.interval);
    pomoState.running = false;
    pomoState.timeLeft = 0;
    if (pomoState.mode === 'work') {
        switchPomoMode(data.pomodoro.sessionsToday % 4 === 0 ? 'long' : 'short');
    } else {
        switchPomoMode('work');
    }
}

function updatePomoDisplay() {
    const mins = Math.floor(pomoState.timeLeft / 60).toString().padStart(2, '0');
    const secs = (pomoState.timeLeft % 60).toString().padStart(2, '0');
    const timeEl = document.querySelector('.pomo-time');
    if (timeEl) timeEl.textContent = `${mins}:${secs}`;

    const total = pomoState.mode === 'work' ? data.settings.pomoDuration * 60
        : pomoState.mode === 'short' ? data.settings.shortBreak * 60
        : data.settings.longBreak * 60;
    const circumference = 2 * Math.PI * 124;
    const progress = 1 - (pomoState.timeLeft / total);
    const ring = document.querySelector('.pomo-ring-progress');
    if (ring) ring.style.strokeDashoffset = circumference * (1 - progress);

    // Update page title
    document.title = `${mins}:${secs} — Workspace`;
}

// ============================================================
//  HABITS
// ============================================================
function getWeekDays() {
    const days = [];
    const now = new Date();
    const dayOfWeek = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((dayOfWeek + 6) % 7));
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d.toISOString().split('T')[0]);
    }
    return days;
}

function renderHabits(container) {
    const weekDays = getWeekDays();
    const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    container.innerHTML = `<div class="habits-grid">
        ${data.habits.map(habit => {
            const checkedThisWeek = weekDays.filter(d => (habit.completedDates || []).includes(d)).length;
            const streak = calculateStreak(habit);
            return `<div class="habit-row">
                <div class="habit-info">
                    <div class="habit-name">${esc(habit.name)}</div>
                    <div class="habit-streak">${streak > 0 ? `${streak} day streak` : 'No streak yet'}</div>
                </div>
                <div class="habit-week">
                    ${weekDays.map((day, i) => {
                        const checked = (habit.completedDates || []).includes(day);
                        const isToday = day === todayStr();
                        return `<div>
                            <div class="habit-day-label">${dayLabels[i]}</div>
                            <div class="habit-day ${checked ? 'checked' : ''} ${isToday ? 'today' : ''}"
                                data-habit="${habit.id}" data-day="${day}">${checked ? '&#10003;' : ''}</div>
                        </div>`;
                    }).join('')}
                </div>
                <div class="habit-progress">
                    <div class="habit-progress-val">${checkedThisWeek}/7</div>
                    <div class="habit-progress-label">This Week</div>
                </div>
                <div class="habit-actions">
                    <button class="btn btn-sm btn-ghost btn-danger habit-delete" data-id="${habit.id}">&times;</button>
                </div>
            </div>`;
        }).join('')}
        <div class="habit-add-form">
            <input type="text" id="habitInput" placeholder="New habit name..." class="form-input">
            <button class="btn btn-primary btn-sm" id="addHabitBtn">Add Habit</button>
        </div>
    </div>`;

    // Toggle habit day
    container.querySelectorAll('.habit-day').forEach(el => {
        el.onclick = () => {
            const habit = data.habits.find(h => h.id === el.dataset.habit);
            if (!habit) return;
            if (!habit.completedDates) habit.completedDates = [];
            const day = el.dataset.day;
            const idx = habit.completedDates.indexOf(day);
            if (idx !== -1) habit.completedDates.splice(idx, 1);
            else habit.completedDates.push(day);
            saveData();
            renderHabits(container);
        };
    });

    // Add habit
    const addBtn = document.getElementById('addHabitBtn');
    const habitInput = document.getElementById('habitInput');
    const doAdd = () => {
        const name = habitInput.value.trim();
        if (!name) return;
        data.habits.push({ id: uid(), name, completedDates: [], created: Date.now() });
        saveData();
        renderHabits(container);
        toast('Habit added');
    };
    addBtn.onclick = doAdd;
    habitInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAdd(); });

    // Delete habit
    container.querySelectorAll('.habit-delete').forEach(btn => {
        btn.onclick = () => {
            data.habits = data.habits.filter(h => h.id !== btn.dataset.id);
            saveData();
            renderHabits(container);
            toast('Habit deleted');
        };
    });
}

function calculateStreak(habit) {
    if (!habit.completedDates || habit.completedDates.length === 0) return 0;
    const sorted = [...habit.completedDates].sort().reverse();
    let streak = 0;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    for (let i = 0; i <= 365; i++) {
        const checkDate = new Date(today);
        checkDate.setDate(today.getDate() - i);
        const dateStr = checkDate.toISOString().split('T')[0];
        if (sorted.includes(dateStr)) {
            streak++;
        } else if (i > 0) {
            break;
        }
    }
    return streak;
}

// ============================================================
//  GLOBAL SEARCH
// ============================================================
document.getElementById('globalSearch').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    if (!q) { renderPage(); return; }

    if (currentPage === 'tasks') {
        document.querySelectorAll('.kanban-card').forEach(card => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(q) ? '' : 'none';
        });
    }
});

// ============================================================
//  SIDEBAR ACTIONS
// ============================================================
document.getElementById('sidebarToggle').onclick = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
};

document.getElementById('themeToggle').onclick = () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    data.settings.theme = next;
    saveData();
    toast(`Switched to ${next} mode`);
};

document.getElementById('quickAddBtn').onclick = () => openTaskModal('todo');

// Export
document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `workspace_backup_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported');
};

// Import
document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const imported = JSON.parse(ev.target.result);
            if (imported.tasks && imported.notes !== undefined) {
                data = imported;
                saveData();
                renderPage();
                toast('Data imported successfully');
            } else {
                toast('Invalid file format', 'error');
            }
        } catch {
            toast('Failed to parse file', 'error');
        }
    };
    reader.readAsText(file);
    e.target.value = '';
};

// Clear all
document.getElementById('clearAllBtn').onclick = () => {
    openModal('Clear All Data', '<p style="color:var(--text-1)">Are you sure you want to delete all your data? This cannot be undone.</p>',
        `<button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary btn-danger" id="confirmClear" style="background:var(--danger);border-color:var(--danger)">Delete Everything</button>`);
    document.getElementById('confirmClear').onclick = () => {
        data = defaultData();
        saveData();
        activeNoteId = null;
        closeModal();
        renderPage();
        toast('All data cleared');
    };
};

// Keyboard shortcut: Ctrl+K = search focus
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('globalSearch').focus();
    }
});

// ============================================================
//  INIT
// ============================================================
// Apply saved theme
document.documentElement.setAttribute('data-theme', data.settings.theme || 'dark');

// Make closeModal globally available for inline onclick
window.closeModal = closeModal;

// Initial render
renderPage();

})();
</script>
</body>
</html>
